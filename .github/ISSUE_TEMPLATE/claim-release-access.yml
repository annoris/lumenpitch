name: Claim Release Access ($149 Solana Pay)
description: Submit your Solana transaction signature (SOL or USDC-SPL) to unlock LumenPitch release downloads and private repository access.
title: "[Release Access Claim]: "
labels:
  - release-access-claim

body:
  - type: markdown
    attributes:
      value: |
        ### Unlock LumenPitch Release Access ($149 USD One-Time)

        Submit this form after sending **$149 USD in SOL** (at the live exchange rate) or **149 USDC-SPL** on the **Solana Mainnet** to our official wallet address:

        ```text
        3HvUMCUSSHEdtA35UuD4J7mbgpTxJ7LgT2X7GfdzvBdm
        ```

        **Important for Automated GitHub Verification:**
        - Your Solana transaction **Memo** must include `gh:<your-github-username>` (matching the GitHub account opening this issue) so our automated workflow can verify ownership and prevent transaction replay.
        - Once verified on Solana Mainnet RPC, the GitHub Actions workflow will automatically comment on this issue and send your GitHub account a read-access invitation to the private release repository.

  - type: input
    id: tx_signature
    attributes:
      label: Solana Transaction Signature (txSig)
      description: Paste the Base58 transaction signature (87–88 characters) from Phantom, Solflare, Backpack, or Solscan.
      placeholder: 5UfDuX7h...
    validations:
      required: true

  - type: dropdown
    id: payment_asset
    attributes:
      label: Payment Asset Sent
      description: Select which asset you transferred on Solana Mainnet to 3HvUMCUSSHEdtA35UuD4J7mbgpTxJ7LgT2X7GfdzvBdm.
      options:
        - SOL (Native Solana — $149 USD equivalent)
        - USDC-SPL (149 USDC on Solana — Mint EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v)
    validations:
      required: true

  - type: input
    id: memo_value
    attributes:
      label: On-Chain Memo Included in Transaction
      description: Confirm the exact memo text attached to your Solana transfer (must contain gh:<your-github-username>).
      placeholder: gh:octocat
    validations:
      required: true

  - type: checkboxes
    id: verification_checks
    attributes:
      label: Pre-Submission Checklist
      options:
        - label: I sent at least $149 USD in SOL or 149 USDC-SPL on Solana Mainnet to `3HvUMCUSSHEdtA35UuD4J7mbgpTxJ7LgT2X7GfdzvBdm`.
          required: true
        - label: My transaction is finalized on Solana Mainnet and includes `gh:<my-github-username>` in the on-chain Memo.
          required: true
